 link" href="/article/uzk9kadv/" data-v-fef9a373 data-v-010ed190><!--[-->自动获取 onedrive 配置并添加 alist 存储<!--]--><!----></a></h3><div class="post-meta" data-v-fef9a373><div class="category-list" data-v-fef9a373><span class="icon vpi-folder" data-v-fef9a373></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=be7b9b" data-v-fef9a373 data-v-010ed190><!--[-->tutorials<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-fef9a373><span class="icon vpi-tag" data-v-fef9a373></span><!--[--><a class="vp-link no-icon link tag vp-tag-g0ib" href="/blog/tags/?tag=alist" data-v-fef9a373 data-v-010ed190><!--[-->alist<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-7k0z" href="/blog/tags/?tag=onedrive" data-v-fef9a373 data-v-010ed190><!--[-->onedrive<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-ig5r" href="/blog/tags/?tag=云盘" data-v-fef9a373 data-v-010ed190><!--[-->云盘<!--]--><!----></a><!--]--></div><div class="create-time" data-v-fef9a373><span class="icon vpi-clock" data-v-fef9a373></span><span data-v-fef9a373>2025-06-11</span></div></div><div class="vp-doc excerpt" data-v-fef9a373><p>在 Alist 被收购后，出于对闭源 API 的不信任，作者编写了一个 Python 脚本，自动完成从 OneDrive 授权 → 获取 refresh_token → 添加挂载至 Alist 的全过程，全程不依赖 Alist 内部闭源接口。此工具适合希望手动控制 OneDrive 授权过程，同时保持挂载配置简洁、私密、安全的 Alist 用户。</p>
