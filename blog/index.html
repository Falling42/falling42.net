"icon vpi-folder" data-v-486cfe16></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=be7b9b" data-v-486cfe16 data-v-a0959939><!--[-->tutorials<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-486cfe16><span class="icon vpi-tag" data-v-486cfe16></span><!--[--><a class="vp-link no-icon link tag vp-tag-n9u1" href="/blog/tags/?tag=alist" data-v-486cfe16 data-v-a0959939><!--[-->alist<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-miw4" href="/blog/tags/?tag=onedrive" data-v-486cfe16 data-v-a0959939><!--[-->onedrive<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-1m70" href="/blog/tags/?tag=云盘" data-v-486cfe16 data-v-a0959939><!--[-->云盘<!--]--><!----></a><!--]--></div><div class="create-time" data-v-486cfe16><span class="icon vpi-clock" data-v-486cfe16></span><span data-v-486cfe16>2025-06-11</span></div></div><div class="vp-doc excerpt" data-v-486cfe16><p>在 Alist 被收购后，出于对闭源 API 的不信任，作者编写了一个 Python 脚本，自动完成从 OneDrive 授权 → 获取 refresh_token → 添加挂载至 Alist 的全过程，全程不依赖 Alist 内部闭源接口。此工具适合希望手动控制 OneDrive 授权过程，同时保持挂载配置简洁、私密、安全的 Alist 用户。</p>
</div></div></div></template><template><div class="vp-blog-post-item" data-allow-mismatch data-v-ba3a6bf5 data-v-486cfe16><!----><div class="blog-post-item-content" data-v-486cfe16><h3 data-v-486cfe16><!----><!----><a class="vp-link no-icon link" href="/article/7ldwycdm/" data-v-486cfe16 data-v-a0959939><!--[-->使用ZoneABC 子域名接入 Cloudflare SaaS<!--]--><!----></a></h3><div class="post-meta" data-v-486cfe16><div class="category-list" data-v-486cfe16><span class="icon vpi-folder" data-v-486cfe16></span><!--[--><!--[--><a class="vp-link no-icon link" href="/blog/categories/?id=be7b9b" data-v-486cfe16 data-v-a0959939><!--[-->tutorials<!--]--><!----></a><!----><!--]--><!--]--></div><div class="tag-list" data-v-486cfe16><span class="icon vpi-tag" data-v-486cfe16></span><!--[--><a class="vp-link no-icon link tag vp-tag-feir" href="/blog/tags/?tag=cloudflare" data-v-486cfe16 data-v-a0959939><!--[-->cloudflare<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-slkh" href="/blog/tags/?tag=zoneabc" data-v-486cfe16 data-v-a0959939><!--[-->zoneabc<!--]--><!----></a><a class="vp-link no-icon link tag vp-tag-604t" href="/blog/tags/?tag=域名" data-v-486cfe16 data-v-a0959939><!--[-->域名<!--]--><!----></a><!--]--></div><div class="create-time" data-v-486cfe16><span class="icon vpi-clock" data-v-486cfe16></span><span data-v-486cfe16>2025-06-10</span></div></div><div class="vp-doc excerpt" data-v-486cfe16><p>本文介绍了如何利用 ZoneABC 提供的免费子域名服务来接入 Cloudflare SaaS，从而将你未托管在 Cloudflare 的域名也纳入其强大的 CDN 和安全保护之下。</p>
